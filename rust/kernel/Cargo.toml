[package]
name = "omnilimit-kernel"
version = "0.0.0"
edition = "2021"
description = "A keyed GCRA rate limiter in fixed memory: lock-free for known clients, and it never admits more than the policy."
license = "MIT"
repository = "https://github.com/PabloAlaniz/omnilimit"
publish = false

[dependencies]
ahash = "0.8"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest = "1"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
