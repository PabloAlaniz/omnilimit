name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ts_released: ${{ steps.release.outputs['ts--release_created'] }}
      py_released: ${{ steps.release.outputs['python--release_created'] }}
      ts_tag: ${{ steps.release.outputs['ts--tag_name'] }}
      py_tag: ${{ steps.release.outputs['python--tag_name'] }}
      pr: ${{ steps.release.outputs.pr }}
      own_token: ${{ steps.token.outputs.own }}
    steps:
      # With RELEASE_PLEASE_TOKEN (a fine-grained token of the maintainer: Contents and Pull
      # requests, read and write, on this repository) the release pull request is opened as the
      # maintainer, so its `pull_request` checks run on their own and need no approval. Without
      # it, the workflow token opens it, GitHub holds those checks for approval, and the release
      # cannot merge until someone approves them.
      - id: token
        env:
          OWN_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: echo "own=$([ -n "$OWN_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Without RELEASE_PLEASE_TOKEN the release pull request is opened with the workflow token, so
  # `pull_request` workflows do not run on it by themselves. Run the checks on its branch, so a
  # broken release shows up before anyone approves it.
  check-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.own_token != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          TITLE: ${{ fromJSON(needs.release-please.outputs.pr).title }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run pr-title.yml --ref "$BRANCH" -f title="$TITLE"

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.ts_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/omnilimit
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: npm publish --provenance --access public
        working-directory: ts

  publish-pypi:
    needs: release-please
    if: needs.release-please.outputs.py_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/omnilimit/
    permissions:
      contents: read
      id-token: write # OIDC for PyPI trusted publishing and attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.x" }
      - run: uv build --out-dir dist
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist

  # A CycloneDX bill of materials for each released package, attached to its GitHub release.
  # Both packages have no runtime dependencies, and the file is what states it.
  sbom:
    needs: release-please
    if: needs.release-please.outputs.ts_released == 'true' || needs.release-please.outputs.py_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the files to the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.x" }
      - name: npm package
        if: needs.release-please.outputs.ts_released == 'true'
        env:
          TAG: ${{ needs.release-please.outputs.ts_tag }}
        run: |
          pnpm install --frozen-lockfile
          (cd ts && npm sbom --sbom-format cyclonedx --omit dev) > omnilimit-npm.cdx.json
          gh release upload "$TAG" omnilimit-npm.cdx.json --clobber
      - name: Python package
        if: needs.release-please.outputs.py_released == 'true'
        env:
          TAG: ${{ needs.release-please.outputs.py_tag }}
        run: |
          (cd python && uv export --format cyclonedx1.5 --no-dev --locked) > omnilimit-pypi.cdx.json
          gh release upload "$TAG" omnilimit-pypi.cdx.json --clobber
