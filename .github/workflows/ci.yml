name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts this on the release branch: a pull request opened with the
  # workflow token does not trigger `pull_request`, and the checks are required to merge.
  workflow_dispatch:
  # Store images and toolchains move under fixed tags. A weekly run on `main` finds what changed
  # outside the repository before a contributor does.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OMNILIMIT_TEST_REDIS_URLS: redis://127.0.0.1:6379,redis://127.0.0.1:6380
  OMNILIMIT_TEST_POSTGRES_URLS: postgres://postgres:omnilimit@127.0.0.1:5415/omnilimit,postgres://postgres:omnilimit@127.0.0.1:5417/omnilimit

jobs:
  spec:
    name: spec in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: python tools/gen_vectors.py --check
      - run: python tools/sync_assets.py --check

  pinned:
    name: actions pinned by commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # A tag can be moved to other code. Every `uses:` names a full commit, or a local path.
      - run: |
          if grep -rnE '^\s*(-\s+)?uses:' .github/workflows | grep -vE 'uses:\s+(\./|[^@ ]+@[0-9a-f]{40}( |$))'; then
            echo "::error::pin these actions to a full commit SHA"
            exit 1
          fi

  core:
    name: core (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter omnilimit coverage

  stores:
    name: stores (redis, valkey, postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services: &services
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6380:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres15:
        image: postgres:15-alpine
        env: { POSTGRES_PASSWORD: omnilimit, POSTGRES_DB: omnilimit }
        ports: ["5415:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres17:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: omnilimit, POSTGRES_DB: omnilimit }
        ports: ["5417:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OMNILIMIT_REQUIRE_STORES: "1"
      OMNILIMIT_TEST_REDIS_CLUSTER_URLS: redis://127.0.0.1:6381
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # A service container cannot run a script of the repository, so the cluster starts here.
      - &redis_cluster
        name: redis cluster (one node, every slot)
        run: |
          docker run -d --name redis-cluster -e PORT=6381 -p 127.0.0.1:6381:6381 \
            -v "$PWD/tools/redis_cluster.sh:/redis_cluster.sh:ro" redis:7-alpine sh /redis_cluster.sh
          timeout 60 sh -c 'until docker logs redis-cluster 2>&1 | grep -q "cluster ready"; do sleep 0.5; done'
      - run: pnpm test:stores

  workerd:
    name: workerd (durable objects, binding)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workerd

  package:
    name: package (publint, attw, tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:package
      - name: dependencies stay empty
        run: test "$(jq -r '.dependencies // {} | length' ts/package.json)" = "0"
      - run: node tools/smoke_tarball.mjs

  mutants:
    name: mutants (the suite can fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutants

  # Both ports against the independent model on vectors nobody picked, and through every
  # interleaving of the recipes in a few small scopes. A pull request uses one fixed seed, so a
  # failure is the pull request's; the weekly run draws a new one and more vectors.
  fuzz:
    name: fuzz and interleavings (both ports, real stores)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *services
    env:
      OMNILIMIT_REQUIRE_STORES: "1"
      OMNILIMIT_TEST_REDIS_CLUSTER_URLS: redis://127.0.0.1:6381
      OMNILIMIT_FUZZ_VECTORS: ${{ github.workspace }}/.fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.x", enable-cache: true, python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: python
      - *redis_cluster
      - name: draw the vectors
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$SCHEDULED" = "true" ]; then
            python3 tools/fuzz_vectors.py --count 600
          else
            python3 tools/fuzz_vectors.py --seed 20261124 --count 150
          fi
      - name: typescript, memory and real stores
        run: pnpm --filter omnilimit exec vitest run test/core/fuzz.test.ts test/stores/conformance.test.ts
      - name: python, memory and real stores
        run: uv run pytest -q tests/test_fuzz.py tests/test_stores.py -k "fuzz or interleaving or sequence or recipe"
        working-directory: python

  # What a check costs with each store. The times are reported in the job summary; the job fails
  # on the calls each operation makes to the store, which are exact, and on a loose ceiling.
  bench:
    name: benchmarks (calls per operation, cost of a check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services: *services
    env:
      OMNILIMIT_REQUIRE_STORES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.x", enable-cache: true, python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv sync --locked
        working-directory: python
      - run: node tools/bench.mjs --check --json bench-ts.json
      - run: uv run python ../tools/bench.py --check --json ../bench-python.json
        working-directory: python
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: bench-*.json
          if-no-files-found: ignore

  python-core:
    name: python core (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.x", enable-cache: true, python-version: "${{ matrix.python }}" }
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest tests/test_conformance.py tests/test_limiter.py tests/test_fastapi.py tests/test_asgi.py tests/test_recipes.py

  python-stores:
    name: python stores and cross-language
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services: *services
    env:
      OMNILIMIT_REQUIRE_STORES: "1"
      OMNILIMIT_TEST_REDIS_CLUSTER_URLS: redis://127.0.0.1:6381
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.x", enable-cache: true, python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv sync --locked
        working-directory: python
      - *redis_cluster
      # The whole suite, so coverage includes the stores.
      - run: uv run coverage run -m pytest
        working-directory: python
      - run: uv run coverage report
        working-directory: python

  python-package:
    name: python package (clean wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.x", python-version: "3.13" }
      - run: uv build --out-dir dist
        working-directory: python
      - run: python3 tools/smoke_wheel.py python/dist

  python-mutants:
    name: python mutants (the suite can fail)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services: *services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.x", enable-cache: true, python-version: "3.13" }
      - run: uv sync --locked
        working-directory: python
      - run: python3 tools/run_mutants_py.py

  rust:
    name: rust kernel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The scan is NEON on ARM and scalar elsewhere: both run.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: unit tests, properties and the spec's vectors
        run: cargo test --release
      - name: every interleaving of two threads
        run: cargo test --release --test loom
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"
      # The library's own tests: that is where the unsafe code is, and parsing the vectors takes the interpreter minutes.
      - name: undefined behaviour
        if: matrix.os == 'ubuntu-latest'
        run: rustup toolchain install nightly --profile minimal --component miri && cargo +nightly miri test --lib
        env:
          # The property tests look for their saved cases next to the crate.
          MIRIFLAGS: -Zmiri-disable-isolation

  ci-ok:
    name: ci-ok
    if: always()
    needs: [spec, pinned, core, stores, workerd, package, mutants, fuzz, bench, python-core, python-stores, python-package, python-mutants, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
