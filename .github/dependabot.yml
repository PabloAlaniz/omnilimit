version: 2

# Every update waits a week after its release, so a version that is pulled or found malicious in
# its first days never reaches a pull request. Security updates ignore the wait.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
        # The last release, installed under another name to test against it: on its own, so
        # that moving it to a new release is one visible change.
        exclude-patterns: ["omnilimit-released"]

  - package-ecosystem: uv
    directory: /python
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
