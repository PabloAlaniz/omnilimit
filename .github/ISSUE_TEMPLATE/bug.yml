name: Bug report
description: Something behaves differently from the spec or the docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A way around a limit, or anything else with a security impact, does not belong here:
        report it privately, as [SECURITY.md](https://github.com/PabloAlaniz/omnilimit/blob/main/SECURITY.md) describes.
  - type: dropdown
    id: port
    attributes:
      label: Port
      options: [TypeScript, Python, Both, Spec or vectors]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: omnilimit 0.5.0
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Runtime, store and adapter
      placeholder: Node 22, Redis 7 with ioredis, Hono
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The policy, the calls in order with their times, and the decisions you got. The smaller the better.
      render: text
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Link the section of the spec or the docs if one says so.
    validations: { required: true }
